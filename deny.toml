[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste (unmaintained, no known vulnerability) is a build-time proc-macro
  # reached through fastembed -> tokenizers -> macro_rules_attribute on every
  # release target. fastembed stays on the 5.x line for Intel macOS ONNX Runtime
  # support (#91); reassess with the fastembed 6 port, no later than 2026-12-31.
  "RUSTSEC-2024-0436",
  # number_prefix (unmaintained, no known vulnerability) is reached through
  # fastembed -> hf-hub 0.4 -> indicatif 0.17 on every release target. Same
  # fastembed 5.x constraint as above; no later than 2026-12-31.
  "RUSTSEC-2025-0119",
]

[licenses]
version = 2
confidence-threshold = 0.66
unused-allowed-license = "warn"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies are tied to the checked-out source tree. Keep
# registry wildcard versions denied without duplicating the ctx package version.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
