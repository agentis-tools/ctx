[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste is unmaintained (no reported vulnerability); transitive through
  # fastembed/image. Maintainer re-review: fastembed stays pinned at =5.4.0
  # because 5.17+ (ort-sys rc.12) breaks the x86_64-apple-darwin and glibc 2.35
  # release targets, so no maintained replacement is selectable yet.
  # Reassess with the next fastembed update, no later than 2026-12-31.
  "RUSTSEC-2024-0436",
  # number_prefix is unmaintained but has no reported vulnerability; it is
  # transitive through the same pinned fastembed line. Remove when Intel macOS
  # can move to a maintained ORT distribution, no later than 2026-12-31.
  "RUSTSEC-2025-0119",
]

[licenses]
version = 2
confidence-threshold = 0.66
unused-allowed-license = "warn"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies are tied to the checked-out source tree. Keep
# registry wildcard versions denied without duplicating the ctx package version.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
