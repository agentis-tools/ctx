version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-runtime:
        dependency-type: production
      rust-development:
        dependency-type: development
    ignore:
      # fastembed selects the ort/ONNX Runtime build, and newer releases pull
      # prebuilts that do not link on two of our release targets (see the pin
      # comment in Cargo.toml). Bumping it is a manual decision that has to be
      # validated against the full release matrix, not an automated one.
      - dependency-name: fastembed
      - dependency-name: ort
      - dependency-name: ort-sys

  - package-ecosystem: cargo
    directory: "/perf"
    schedule:
      interval: weekly
      day: monday
    groups:
      perf-harness:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/docs/website"
    schedule:
      interval: weekly
      day: monday
    groups:
      documentation-site:
        patterns: ["*"]
